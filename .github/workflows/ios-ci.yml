name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Coverage
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run strict core coverage gate
        run: Scripts/check_core_coverage.sh 90

  ios-app:
    name: iPhone App & Integration Tests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available iOS simulators
        run: xcrun simctl list devices available

      - name: Run app and integration tests
        run: |
          destination="$(Scripts/select_ios_simulator.sh)"
          echo "Using simulator destination: ${destination}"
          simulator_udid="${destination#*id=}"
          # The test host runs inside the simulator, so job-level variables are
          # not inherited. Inject the hosted-runner regression ceiling there.
          xcrun simctl boot "${simulator_udid}" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "${simulator_udid}" -b
          xcrun simctl spawn "${simulator_udid}" launchctl setenv CARTRACK_PERFORMANCE_P95_SECONDS 20
          cleanup_simulator_environment() {
            xcrun simctl spawn "${simulator_udid}" launchctl unsetenv CARTRACK_PERFORMANCE_P95_SECONDS >/dev/null 2>&1 || true
          }
          trap cleanup_simulator_environment EXIT
          xcodebuild \
            -project Cartrack.xcodeproj \
            -scheme Cartrack \
            -destination "${destination}" \
            -parallel-testing-enabled NO \
            -only-testing:CartrackTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  ios-ui:
    name: iPhone UI Tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Capture
            test_class: CartrackCaptureUITests
          - name: Data
            test_class: CartrackDataUITests
          - name: Presentation
            test_class: CartrackPresentationUITests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available iOS simulators
        run: xcrun simctl list devices available

      # A single simulator per runner avoids CoreSimulator migration contention
      # and preserves the destination for the entire xcodebuild invocation.
      - name: Run UI test shard
        run: |
          destination="$(Scripts/select_ios_simulator.sh)"
          echo "Using simulator destination: ${destination}"
          simulator_udid="${destination#*id=}"
          xcrun simctl boot "${simulator_udid}" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "${simulator_udid}" -b
          xcodebuild \
            -project Cartrack.xcodeproj \
            -scheme Cartrack \
            -destination "${destination}" \
            -parallel-testing-enabled NO \
            -only-testing:CartrackUITests/${{ matrix.test_class }} \
            CODE_SIGNING_ALLOWED=NO \
            test

  # Retains the established required-check name while making it reflect every
  # app and UI shard result.
  ios-summary:
    name: iPhone App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ios-app, ios-ui]
    if: ${{ always() }}

    steps:
      - name: Verify every iOS test job passed
        run: |
          test "${{ needs.ios-app.result }}" = "success"
          test "${{ needs.ios-ui.result }}" = "success"
